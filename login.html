<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — CarGlanz India | Premium Car Care</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script type="module">
  import { signIn, signUp, getUser } from './auth.js'

  // Redirect if already logged in
  getUser().then(user => {
    if (user) window.location.href = 'index.html'
  })

  window.handleAuth = async function() {
    const email    = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value
    const errEl    = document.getElementById('auth-error')
    const btnEl    = document.getElementById('auth-btn')

    if (!email || !password) {
      errEl.textContent = 'Please enter your email and password.'
      return
    }

    errEl.textContent = ''
    btnEl.disabled = true
    btnEl.textContent = currentMode === 'login' ? 'Signing in…' : 'Creating account…'

    const { data, error } = currentMode === 'login'
      ? await signIn(email, password)
      : await signUp(email, password)

    if (error) {
      errEl.textContent = error.message
      btnEl.disabled = false
      btnEl.textContent = currentMode === 'login' ? 'Sign In' : 'Create Account'
      return
    }

    // After success, go back to checkout or home
    const dest = sessionStorage.getItem('redirect_after_login') || 'index.html'
    sessionStorage.removeItem('redirect_after_login')
    window.location.href = dest
  }
</script>

<style>
:root {
  --cream:#e8edf2; --sand:#9aaab8; --bark:#4a5a6a;
  --moss:#2a3a4a; --forest:#1a2535; --warm-black:#0a0c10;
  --sage:#6a8090; --gold:#c9a84c; --gold-light:#e8c96a;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Jost',sans-serif;
  background:var(--warm-black);
  color:var(--cream);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  overflow:hidden;
}

/* Background texture */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(42,58,74,.5) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(26,37,53,.4) 0%, transparent 60%);
  pointer-events:none;
  z-index:0;
}

/* Logo at top */
.logo-wrap{
  text-align:center;
  margin-bottom:32px;
  position:relative;
  z-index:1;
}
.logo{
  font-family:'Cormorant Garamond',serif;
  font-size:2rem;
  font-weight:600;
  letter-spacing:8px;
  text-transform:uppercase;
  text-decoration:none;
  color:var(--cream);
}
.logo em{color:var(--gold);font-style:normal}
.logo-tagline{
  font-size:.62rem;
  letter-spacing:4px;
  text-transform:uppercase;
  color:var(--sage);
  margin-top:6px;
}

/* Card */
.auth-card{
  width:100%;
  max-width:420px;
  background:rgba(26,37,53,.65);
  border:1px solid rgba(201,168,76,.18);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  padding:40px 36px 36px;
  position:relative;
  z-index:1;
}
.auth-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,.4),transparent);
}

/* Tabs */
.tab-row{
  display:flex;
  border-bottom:1px solid rgba(201,168,76,.15);
  margin-bottom:28px;
}
.tab-btn{
  flex:1;
  padding:10px 0;
  background:none;
  border:none;
  border-bottom:2px solid transparent;
  font-family:'Jost',sans-serif;
  font-size:.68rem;
  letter-spacing:3px;
  text-transform:uppercase;
  cursor:pointer;
  transition:color .25s, border-color .25s;
  color:var(--sage);
  margin-bottom:-1px;
}
.tab-btn.active{
  color:var(--gold);
  border-bottom-color:var(--gold);
}

/* Fields */
.field{
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-bottom:14px;
}
.field label{
  font-size:.62rem;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--sage);
  font-weight:500;
}
.field input{
  background:rgba(10,12,16,.4);
  border:1px solid rgba(201,168,76,.12);
  color:var(--cream);
  padding:13px 16px;
  font-family:'Jost',sans-serif;
  font-size:15px;
  outline:none;
  transition:border-color .25s, background .25s;
  -webkit-appearance:none;
  appearance:none;
  width:100%;
}
.field input::placeholder{color:var(--sand);opacity:.45}
.field input:focus{
  border-color:rgba(201,168,76,.45);
  background:rgba(26,37,53,.6);
}

/* Error */
#auth-error{
  font-size:.78rem;
  color:#e05a3a;
  min-height:20px;
  margin-bottom:14px;
  line-height:1.4;
}

/* Submit button */
.auth-btn{
  width:100%;
  padding:14px;
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  border:none;
  color:#0a0c10;
  font-family:'Jost',sans-serif;
  font-weight:700;
  letter-spacing:3px;
  font-size:.72rem;
  text-transform:uppercase;
  cursor:pointer;
  transition:opacity .25s, transform .15s;
  margin-top:4px;
}
.auth-btn:hover{opacity:.88}
.auth-btn:active{transform:scale(.98)}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}

/* Back link */
.back-link{
  display:block;
  text-align:center;
  margin-top:22px;
  font-size:.68rem;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--sage);
  text-decoration:none;
  transition:color .25s;
}
.back-link:hover{color:var(--gold)}

/* Signup note */
#signup-note{
  display:none;
  font-size:.72rem;
  color:var(--sage);
  line-height:1.6;
  margin-bottom:16px;
  padding:10px 14px;
  border-left:2px solid rgba(201,168,76,.3);
  background:rgba(201,168,76,.05);
}

/* Footer strip */
.auth-footer{
  margin-top:36px;
  font-size:.6rem;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--bark);
  text-align:center;
  z-index:1;
  position:relative;
}
</style>
</head>
<body>

<div class="logo-wrap">
  <a href="index.html" class="logo"><em>CAR</em>GLANZ</a>
  <div class="logo-tagline">Premium Car Care · Engineered for India</div>
</div>

<div class="auth-card">

  <div class="tab-row">
    <button class="tab-btn active" id="tab-login" onclick="setMode('login')">Sign In</button>
    <button class="tab-btn" id="tab-signup" onclick="setMode('signup')">Create Account</button>
  </div>

  <div class="field">
    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="you@example.com"
      onkeydown="if(event.key==='Enter')handleAuth()" autocomplete="email" />
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••"
      onkeydown="if(event.key==='Enter')handleAuth()" autocomplete="current-password" />
  </div>

  <p id="auth-error"></p>

  <div id="signup-note">
    You'll receive a confirmation email. Click the link in it to activate your account before signing in.
  </div>

  <button class="auth-btn" id="auth-btn" onclick="handleAuth()">Sign In</button>

  <a href="index.html" class="back-link">← Back to store</a>

</div>

<div class="auth-footer">© 2026 CarGlanz India · Engineered ⚡ in India</div>

<script>
let currentMode = 'login'

function setMode(mode) {
  currentMode = mode

  document.getElementById('tab-login').classList.toggle('active', mode === 'login')
  document.getElementById('tab-signup').classList.toggle('active', mode === 'signup')

  document.getElementById('auth-btn').textContent =
    mode === 'login' ? 'Sign In' : 'Create Account'

  document.getElementById('signup-note').style.display =
    mode === 'signup' ? 'block' : 'none'

  // Update autocomplete hint for password
  document.getElementById('password').setAttribute('autocomplete',
    mode === 'login' ? 'current-password' : 'new-password')

  document.getElementById('auth-error').textContent = ''
}
</script>

</body>
</html>
